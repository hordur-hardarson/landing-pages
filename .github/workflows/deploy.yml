name: Deploy internal pages

# Every top-level folder containing an index.html is published to
# lp.heimkoma.app/<folder>/. Adding a page means adding a folder and pushing:
# no key, no server change and no edit to this file.
#
# This replaced a key per page, which cost five setup steps each and had left
# seven of the ten pages under /lp/ with no deployment at all.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-lp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: List the pages to publish
        id: pages
        run: |
          pages=""
          for dir in */; do
            page="${dir%/}"
            case "$page" in .*) continue ;; esac
            if [ -f "$page/index.html" ]; then
              pages="$pages $page"
            else
              echo "skip $page (no index.html)"
            fi
          done
          pages="${pages# }"
          [ -n "$pages" ] || { echo "::error::no publishable pages found"; exit 1; }
          echo "list=$pages" >> "$GITHUB_OUTPUT"
          echo "publishing:$pages"

      # A handbook caches itself for offline use under a fixed cache name, so a
      # returning guest would keep seeing the old version forever. Stamping the
      # commit into the name makes every deploy a new cache, which the service
      # worker's own activate handler then swaps to: offline still works, but
      # updates actually arrive. Pages without a service worker skip this.
      - name: Version the service worker caches
        run: |
          for page in ${{ steps.pages.outputs.list }}; do
            [ -f "$page/sw.js" ] || continue
            sed -i "s|const CACHE = '\([^']*\)'|const CACHE = '\1-${GITHUB_SHA::7}'|" "$page/sw.js"
            grep -n "const CACHE" "$page/sw.js"
          done

      - name: Load the deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.LP_DEPLOY_KEY }}" > ~/.ssh/lp_key
          chmod 600 ~/.ssh/lp_key
          # The host key is public, so it is pinned here rather than kept secret.
          printf '%s\n' '[82.180.175.89]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAAOCTG0pbsCsYui1VBsDGAmCp37d73W8y9xdyUvB4mX' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # The key is pinned on the server to a forced command that accepts one
      # plain folder name under /lp/ and refuses anything else: no traversal, no
      # nested paths, no reading back. It cannot reach the main site, WordPress,
      # the uploaded media or the cleaning-form backend.
      - name: Publish each page
        run: |
          for page in ${{ steps.pages.outputs.list }}; do
            echo "--- $page"
            rsync -rltvz --delete --delete-excluded --chmod=D755,F644 \
              --exclude 'DEPLOY.txt' --exclude '.DS_Store' --exclude 'README.md' \
              -e "ssh -i ~/.ssh/lp_key -p 65002 -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes" \
              "$page/" "u861019222@82.180.175.89:$page"
          done

      - name: Confirm the pages are serving
        run: |
          fail=0
          for page in ${{ steps.pages.outputs.list }}; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://lp.heimkoma.app/$page/")
            echo "$page -> $code"
            [ "$code" = "200" ] || fail=1
            # DEPLOY.txt was publicly readable once; confirm it is not served.
            gone=$(curl -s -o /dev/null -w '%{http_code}' "https://lp.heimkoma.app/$page/DEPLOY.txt")
            [ "$gone" = "200" ] && { echo "$page/DEPLOY.txt is public"; fail=1; }
          done
          exit $fail
